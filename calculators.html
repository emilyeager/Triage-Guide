<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calculators — Triage Guide</title>
    <style>
    :root{--bg:#f7f9fc;--card:#ffffff;--brand:#000000;--muted:#556}
    html,body{height:100%}
    body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#111;margin:0}
    .container{max-width:900px;margin:6vh auto;padding:24px;background:var(--card);border-radius:10px}
    h1{margin:0 0 8px;font-size:1.6rem}
    .back{display:inline-block;margin-top:18px;color:var(--muted)}
    .section-heading{font-weight:700;text-decoration:underline;color:#111;margin-top:12px;font-size:1rem}
    .links{list-style:disc inside;padding-left:18px;margin-top:12px}
    /* Calculator boxes */
    .calc-box{border:1px solid #e6e9ee;padding:12px;border-radius:8px;margin:10px 0;background:var(--card)}
    /* Remove number input spinners and disable autocomplete */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0 }
    input[type=number]{-moz-appearance:textfield}
    button.link{background:none;border:0;padding:0;color:var(--brand);text-decoration:underline;cursor:pointer;font:inherit}
    button.link:focus{outline:3px solid rgb(0, 0, 0);outline-offset:2px}
    .sidebar-image{float:right;max-width:560px;width:56%;height:auto;margin-left:16px;margin-top:6px;border-radius:6px}
  </style>
</head>
<body>
  <main class="container" role="main">
    <h1>Calculators</h1>
    <p class="back"><a href="index.html">← Back to Triage Guide Homepage</a></p>
    <section>
      <h2 class="section-heading">Paediatrics Calculators</h2>
      <ul class="links">
        <li>ETT depth/length</li>
        <li>
          <button class="link toggle" aria-expanded="false" aria-controls="ett-size-panel">ETT size</button>
          <div id="ett-size-panel" hidden>
            <div class="calc">
              <label for="uncuffed-age">Uncuffed ETT (Age/4 + 4)</label>
              <input id="uncuffed-age" type="number" min="0" step="0.1" placeholder="Age in years" />
              <div>Size: <output id="uncuffed-result">—</output> mm</div>
            </div>
            <div class="calc">
              <label for="cuffed-age">Cuffed/microcuff ETT (Age/4 + 3.5)</label>
              <input id="cuffed-age" type="number" min="0" step="0.1" placeholder="Age in years" />
              <div>Size: <output id="cuffed-result">—</output> mm</div>
            </div>
          </div>
        </li>
        <li>Fluid maintenance</li>
        <li>Weight</li>
      </ul>
    </section>

    <style>
      /* Calculators inputs */
      #ett-size-panel .calc{margin:8px 0;padding:6px}
      #ett-size-panel label{display:block;font-weight:600;margin-bottom:6px}
      #ett-size-panel input{width:140px;padding:6px;border-radius:6px;border:1px solid #ccc}
      #ett-size-panel output{font-weight:700;margin-left:6px}
    </style>

    <script>
      // Toggle handler for accessible collapsibles (reuse pattern from other pages)
      document.addEventListener('click', function(e){
        var btn = e.target.closest('button.toggle');
        if(!btn) return;
        var panel = document.getElementById(btn.getAttribute('aria-controls'));
        var expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', String(!expanded));
        if(panel) panel.hidden = expanded;
      });

      function fmt(n){ return Math.round(n*10)/10; }
      var uncInput = document.getElementById('uncuffed-age');
      var uncOut = document.getElementById('uncuffed-result');
      var cuffInput = document.getElementById('cuffed-age');
      var cuffOut = document.getElementById('cuffed-result');

      function updateUnc(){
        var v = parseFloat(uncInput.value);
        if(isFinite(v)) uncOut.textContent = fmt(v/4 + 4).toFixed(1);
        else uncOut.textContent = '—';
      }
      function updateCuff(){
        var v = parseFloat(cuffInput.value);
        if(isFinite(v)) cuffOut.textContent = fmt(v/4 + 3.5).toFixed(1);
        else cuffOut.textContent = '—';
      }
      if(uncInput) uncInput.addEventListener('input', updateUnc);
      if(cuffInput) cuffInput.addEventListener('input', updateCuff);
    </script>
  </main>
</body>
</html>
